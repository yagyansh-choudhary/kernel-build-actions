name: Set Up Kernel Build Environment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/setup-kernel-build-env.yml"

permissions:
  contents: read

jobs:
  setup-kernel-environment:
    name: Ubuntu kernel, Kleaf, Bazel, Python and Rust tools
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Show Ubuntu runner resources
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          echo "CPU cores: $(nproc)"
          free -h
          df -h /

      - name: Update and upgrade Ubuntu
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Install kernel and Android build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get install -y --no-install-recommends \
            apt-transport-https \
            ca-certificates \
            gnupg \
            software-properties-common \
            git \
            git-lfs \
            repo \
            subversion \
            build-essential \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            binutils \
            binutils-dev \
            make \
            bc \
            bison \
            flex \
            clang \
            llvm \
            lld \
            libclang-dev \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            sparse \
            libncurses-dev \
            pkg-config \
            perl \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-venv \
            python3-pyelftools \
            python3-yaml \
            python3-jinja2 \
            python-is-python3 \
            rsync \
            cpio \
            kmod \
            fakeroot \
            lz4 \
            zstd \
            xz-utils \
            zip \
            unzip \
            tar \
            gzip \
            bzip2 \
            curl \
            wget \
            zlib1g-dev \
            liblz4-dev \
            libzstd-dev \
            liblzma-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            x11proto-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            fontconfig \
            device-tree-compiler \
            u-boot-tools \
            ccache \
            ninja-build \
            cmake \
            autoconf \
            automake \
            libtool \
            gettext \
            gawk \
            file \
            patch \
            diffutils \
            jq \
            openssl \
            openjdk-17-jdk-headless \
            libcap-dev \
            libudev-dev \
            libpci-dev

          # These legacy/transitional names are not available on every
          # ubuntu-latest image. Install them when the image provides them.
          for package in git-core x11proto-core-dev; do
            if apt-cache show "$package" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$package"
            else
              echo "$package is not available; its current replacement is already installed."
            fi
          done

          git lfs install --skip-repo
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Bazel through Bazelisk
        shell: bash
        run: |
          set -euxo pipefail

          sudo curl --fail --location --retry 5 \
            --output /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64

          sudo chmod 0755 /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

          bazelisk version
          bazel --version

      - name: Install the Rust toolchain and bindgen
        shell: bash
        run: |
          set -euxo pipefail

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"

          rustup component add rust-src rustfmt clippy
          cargo install --locked bindgen-cli

          rustc --version
          cargo --version
          rustup --version
          bindgen --version

      - name: Verify the complete build environment
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"

          echo "=== Core build tools ==="
          gcc --version | head -n 1
          g++ --version | head -n 1
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          bison --version | head -n 1
          flex --version | head -n 1
          pahole --version
          dtc --version

          echo "=== Bazel / Kleaf prerequisites ==="
          bazel --version
          java -version
          repo version

          echo "=== Python ==="
          python3 --version
          pip3 --version

          echo "=== Rust for Linux prerequisites ==="
          rustc --version
          cargo --version
          bindgen --version

          echo "=== Final resources ==="
          echo "CPU cores: $(nproc)"
          free -h
          df -h /

          echo "Environment setup completed successfully."
          echo "For Android Kleaf builds, use the tools/bazel wrapper included in the Android kernel source tree."
