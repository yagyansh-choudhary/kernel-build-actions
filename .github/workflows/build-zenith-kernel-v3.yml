          --- a/sound/pci/hda/cs35l41_hda_property.c
          +++ b/sound/pci/hda/cs35l41_hda_property.c
          @@ -429,16 +429,28 @@ static int lenovo_legion_no_acpi(struct cs35l41_hda *cs35l41, struct device *phy
           static int asus_rog_2023_ally_fix(struct cs35l41_hda *cs35l41, struct device *physdev, int id,
           				const char *hid)
           {
          -	const char *rog_ally_bios_ver = dmi_get_system_info(DMI_BIOS_VERSION);
          -	const char *rog_ally_bios_num = rog_ally_bios_ver + 6; // Dropping the RC71L. part before the number
          +	const char *rog_ally_bios_ver;
          +	const char *rog_ally_bios_num;
          +	struct cs35l41_hw_cfg *hw_cfg = &cs35l41->hw_cfg;
           	int rog_ally_bios_int;
          -	kstrtoint(rog_ally_bios_num, 10, &rog_ally_bios_int);
          -	if(rog_ally_bios_int >= 330){
          -		printk(KERN_INFO "DSD properties exist in the %d BIOS. Not applying DSD override...\n", rog_ally_bios_int);
          -		return -ENOENT; //Patch not applicable. Exiting...
          -	}
          +	int ret;
           
          -	struct cs35l41_hw_cfg *hw_cfg = &cs35l41->hw_cfg;
          +	rog_ally_bios_ver = dmi_get_system_info(DMI_BIOS_VERSION);
          +	if (!rog_ally_bios_ver || strncmp(rog_ally_bios_ver, "RC71L.", 6))
          +		return -EINVAL;
          +
          +	/* Drop the RC71L. prefix before parsing the numeric BIOS version. */
          +	rog_ally_bios_num = rog_ally_bios_ver + 6;
          +	ret = kstrtoint(rog_ally_bios_num, 10, &rog_ally_bios_int);
          +	if (ret)
          +		return ret;
          +
          +	if (rog_ally_bios_int >= 330) {
          +		dev_info(cs35l41->dev,
          +			 "DSD properties exist in BIOS %d; skipping override\n",
          +			 rog_ally_bios_int);
          +		return -ENOENT;
          +	}
           
           	dev_info(cs35l41->dev, "Adding DSD properties for %s\n", cs35l41->acpi_subsystem_id);
           
          PATCH

          git apply --check "$RUNNER_TEMP/zenith-6.9-warning-cleanup.patch"
          git apply "$RUNNER_TEMP/zenith-6.9-warning-cleanup.patch"
          git diff --check

          # Verify the key warning fixes were applied to the pinned tree.
          grep -q 'fallthrough;' arch/x86/kernel/cpu/intel.c
          grep -q 'STACK_FRAME_NON_STANDARD(jme_check_link);' \
            drivers/net/ethernet/jme.c
          grep -q 'CFLAGS_hci_vhci.o += -fno-optimize-sibling-calls' \
            drivers/bluetooth/Makefile
          grep -A1 '^static noinline_for_stack int$' fs/f2fs/data.c | \
            grep -q '^f2fs_write_cache_pages(struct address_space \*mapping,'
          grep -q 'static noinline_for_stack void mas_wr_bnode' lib/maple_tree.c
          grep -q '^noinline$' lib/zstd/common/entropy_common.c
          grep -q '#define POLL_STACK_ALLOC[[:space:]]*128' include/linux/poll.h

          "$KERNEL_DIR/scripts/checkpatch.pl" --no-tree --strict \
            "$RUNNER_TEMP/zenith-6.9-warning-cleanup.patch" \
            > "$LOG_DIR/warning-cleanup-checkpatch.log" 2>&1 || {
              status=$?
              cat "$LOG_DIR/warning-cleanup-checkpatch.log"
              # The audited patch has no ERROR or WARNING diagnostics. Treat
              # either as fatal while allowing non-fatal CHECK suggestions.
              if grep -qE '^(ERROR|WARNING):' \
                "$LOG_DIR/warning-cleanup-checkpatch.log"; then
                exit "$status"
              fi
            }
          cat "$LOG_DIR/warning-cleanup-checkpatch.log"

      - name: Integrate KernelSU Next and ensure x86_64 fix option exists
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path

          drivers_kconfig = Path("drivers/Kconfig")
          source_entry = 'source "drivers/kernelsu/Kconfig"'
          lines = drivers_kconfig.read_text().splitlines()
          if source_entry not in [line.strip() for line in lines]:
              for i in range(len(lines) - 1, -1, -1):
                  if lines[i].strip() == "endmenu":
                      lines.insert(i, source_entry)
                      break
              else:
                  raise SystemExit("drivers/Kconfig has no endmenu")
              drivers_kconfig.write_text("\n".join(lines).rstrip() + "\n")

          # Some moving dev snapshots have contained the x86_64 implementation
          # before exposing its Kconfig symbol. Add the official symbol locally
          # when absent, so the implementation can actually be enabled.
          ksu_kconfig = Path("KernelSU-Next/kernel/Kconfig")
          text = ksu_kconfig.read_text()
          symbol = "config KSU_X86_PATCH_SYSCALL_DISPATCHER"
          if symbol not in text:
              stanza = "\n".join([
                  "",
                  "config KSU_X86_PATCH_SYSCALL_DISPATCHER",
                  "\tbool \"Dynamically patch x64 hardened syscall dispatcher\"",
                  "\tdepends on KSU && X86_64",
                  "\tdefault n",
                  "\thelp",
                  "\t  Enable KernelSU Next runtime patching for the hardened x86_64",
                  "\t  syscall dispatcher used by Linux 6.9 and related backports.",
                  "",
              ])
              pos = text.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("KernelSU Next Kconfig has no endmenu")
              text = text[:pos] + stanza + "\n" + text[pos:]
              ksu_kconfig.write_text(text)
          PY

          echo "=== KernelSU integration verification ==="
          ls -l drivers/kernelsu
          grep -Fn 'kernelsu' drivers/Makefile || true
          grep -Fn 'drivers/kernelsu/Kconfig' drivers/Kconfig || true

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU-Next/kernel"
          test "$(grep -Fxc 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile)" -eq 1
          grep -Fxq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q '^config KSU_X86_PATCH_SYSCALL_DISPATCHER$' KernelSU-Next/kernel/Kconfig

      - name: Apply original config and resolve new options
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp "$CONFIG_FILE" "$OUT_DIR/.config"

          ./scripts/config --file "$OUT_DIR/.config" \
            --enable X86_64 \
            --enable MODULES \
            --enable KPROBES \
            --enable KPROBES_ON_FTRACE \
            --enable KPROBE_EVENTS \
            --enable EXT4_FS \
            --enable OVERLAY_FS \
            --enable KSU \
            --enable KSU_X86_PATCH_SYSCALL_DISPATCHER

          make O="$OUT_DIR" ARCH=x86_64 LLVM=1 LLVM_IAS=1 olddefconfig

          for option in X86_64 MODULES KPROBES EXT4_FS OVERLAY_FS KSU KSU_X86_PATCH_SYSCALL_DISPATCHER; do
            grep -qx "CONFIG_${option}=y" "$OUT_DIR/.config" || {
              echo "CONFIG_${option}=y is missing after olddefconfig" >&2
              exit 1
            }
          done

          echo "=== Final key config options ==="
          grep -E '^CONFIG_(X86_64|MODULES|KSU|KSU_X86_PATCH_SYSCALL_DISPATCHER|KPROBES|KPROBES_ON_FTRACE|KPROBE_EVENTS|EXT4_FS|OVERLAY_FS|LTO_CLANG_FULL)=' "$OUT_DIR/.config"

      - name: Generate SELinux headers required by KernelSU
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          mkdir -p "$LOG_DIR"

          # KernelSU's file_wrapper.c includes SELinux objsec.h directly.
          # objsec.h includes generated flask.h, but a standalone
          # drivers/kernelsu/ target does not carry SELinux's normal Kbuild
          # dependency that creates this header. Generate both SELinux headers
          # explicitly before the isolated KernelSU preflight.
          # The top-level Makefile does not expose an arbitrary host-tool
          # binary as a direct target. Build the configured host scripts via
          # the supported `scripts` target; CONFIG_SECURITY_SELINUX=y makes
          # Kbuild descend into scripts/selinux/genheaders.
          make \
            --output-sync=target \
            O="$OUT_DIR" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            scripts

          mkdir -p "$OUT_DIR/security/selinux"
          "$OUT_DIR/scripts/selinux/genheaders/genheaders" \
            "$OUT_DIR/security/selinux/flask.h" \
            "$OUT_DIR/security/selinux/av_permissions.h"

          test -s "$OUT_DIR/security/selinux/flask.h"
          test -s "$OUT_DIR/security/selinux/av_permissions.h"
          grep -q '^#define SECCLASS_' "$OUT_DIR/security/selinux/flask.h"
          grep -q '^#define .*__.* 0x' "$OUT_DIR/security/selinux/av_permissions.h"
          {
            echo "Generated SELinux headers for isolated KernelSU preflight"
            ls -lh \
              "$OUT_DIR/security/selinux/flask.h" \
              "$OUT_DIR/security/selinux/av_permissions.h"
            sha256sum \
              "$OUT_DIR/security/selinux/flask.h" \
              "$OUT_DIR/security/selinux/av_permissions.h"
          } | tee "$LOG_DIR/selinux-generated-headers.log"

      - name: Preflight compile KernelSU subtree
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          mkdir -p "$LOG_DIR"

          test -s "$OUT_DIR/security/selinux/flask.h"
          test -s "$OUT_DIR/security/selinux/av_permissions.h"

          START="$(date +%s)"
          set +e
          make \
            --output-sync=target \
            O="$OUT_DIR" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            -j2 \
            drivers/kernelsu/ \
            2>&1 | tee "$LOG_DIR/kernelsu-preflight.log"
          STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========== KERNELSU PREFLIGHT ERRORS =========="
            grep -nEi -B8 -A20 \
              '^[^[:space:]].*:[0-9]+:[0-9]+: (fatal )?error:|^ld\.lld: error:|^clang: error:|undefined reference|LLVM ERROR|internal compiler error' \
              "$LOG_DIR/kernelsu-preflight.log" | head -n 500 || true
            echo
            echo "========== FINAL 300 PREFLIGHT LINES =========="
            tail -n 300 "$LOG_DIR/kernelsu-preflight.log" || true
            exit "$STATUS"
          fi

          # CONFIG_KSU=y builds the subtree into a built-in thin archive.
          # A standalone `drivers/kernelsu/` target does not create kernelsu.o;
          # expecting that non-existent file caused the previous false failure
          # even though all 35 KernelSU translation units compiled successfully.
          KSU_ARCHIVE="$OUT_DIR/drivers/kernelsu/built-in.a"
          test -s "$KSU_ARCHIVE"

          mapfile -t KSU_OBJECTS < <(llvm-ar t "$KSU_ARCHIVE" | sed '/^[[:space:]]*$/d')
          if [ "${#KSU_OBJECTS[@]}" -ne 35 ]; then
            echo "Expected 35 KernelSU objects, found ${#KSU_OBJECTS[@]}" >&2
            printf '%s\n' "${KSU_OBJECTS[@]}" >&2
            exit 1
          fi

          for required_object in \
            feature/sulog.o \
            hook/lsm_hook.o \
            infra/file_wrapper.o \
            manager/apk_sign.o \
            hook/x86_64/syscall_hook.o; do
            printf '%s\n' "${KSU_OBJECTS[@]}" | grep -Fq "drivers/kernelsu/${required_object}" || {
              echo "Missing required KernelSU archive member: ${required_object}" >&2
              exit 1
            }
          done

          END="$(date +%s)"
          echo "KernelSU 35/35 object compile preflight passed in $((END - START)) seconds."
          file "$KSU_ARCHIVE"
          llvm-ar t "$KSU_ARCHIVE"


      - name: Preflight compile warning-cleanup targets
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          mkdir -p "$LOG_DIR"

          # Compile every translation unit touched by the warning patch before
          # starting the long all-driver build. The final LTO warning gate below
          # still validates warnings that only appear while linking vmlinux.
          WARNING_TARGETS=(
            arch/x86/kernel/cpu/intel.o
            sound/pci/hda/cs35l41_hda_property.o
            net/ipv4/tcp_bbr.o
            drivers/input/mouse/vmmouse.o
            drivers/i2c/busses/i2c-nct6775.o
            drivers/hwmon/oxp-sensors.o
            drivers/platform/x86/legion-laptop.o
            drivers/xen/gntdev.o
            drivers/gpu/drm/radeon/radeon_cs.o
            drivers/crypto/ccp/ccp-ops.o
            fs/select.o
            fs/f2fs/data.o
            fs/bcachefs/checksum.o
            fs/bcachefs/fsck.o
            lib/zstd/common/entropy_common.o
            drivers/net/wireguard/allowedips.o
            lib/maple_tree.o
            drivers/bluetooth/hci_vhci.o
            drivers/net/ethernet/jme.o
          )

          START="$(date +%s)"
          set +e
          make \
            --output-sync=target \
            O="$OUT_DIR" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            -j2 \
            "${WARNING_TARGETS[@]}" \
            2>&1 | tee "$LOG_DIR/warning-cleanup-preflight.log"
          STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========== WARNING-CLEANUP PREFLIGHT ERRORS =========="
            grep -nEi -B8 -A20 \
              '^[^[:space:]].*:[0-9]+:[0-9]+: (fatal )?error:|^ld\.lld: error:|^clang: error:|undefined reference|LLVM ERROR|internal compiler error' \
              "$LOG_DIR/warning-cleanup-preflight.log" | head -n 500 || true
            echo
            echo "========== FINAL 300 PREFLIGHT LINES =========="
            tail -n 300 "$LOG_DIR/warning-cleanup-preflight.log" || true
            exit "$STATUS"
          fi

          grep -nEi \
            '(^|[[:space:]])[^[:space:]]+:[0-9]+(:[0-9]+)?: warning:|^ld\.lld[^:]*: warning:|^[^[:space:]].*\.o: warning: objtool:|^WARNING: modpost:|^warning:' \
            "$LOG_DIR/warning-cleanup-preflight.log" \
            > "$LOG_DIR/warning-cleanup-preflight-warnings.txt" || true
          if [ -s "$LOG_DIR/warning-cleanup-preflight-warnings.txt" ]; then
            echo "Warning-cleanup preflight still emitted diagnostics:" >&2
            cat "$LOG_DIR/warning-cleanup-preflight-warnings.txt" >&2
            exit 1
          fi

          END="$(date +%s)"
          echo "Warning-cleanup target preflight passed with zero warnings in $((END - START)) seconds."

      - name: Verify toolchains
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          python3 --version
          bazel --version
          repo version
          rustc --version
          bindgen --version
          java -version
          df -h /

      - name: Compile bzImage and modules
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          rm -rf "$ARTIFACT_DIR" "$MODULES_DIR"
          mkdir -p "$ARTIFACT_DIR" "$LOG_DIR" "$MODULES_DIR"
          rm -f "$OUT_DIR/arch/x86/boot/bzImage" "$OUT_DIR/vmlinux" "$OUT_DIR/System.map"

          BUILD_MARKER="$GITHUB_WORKSPACE/.build-start"
          touch "$BUILD_MARKER"
          START="$(date +%s)"

          set +e
          make \
            --output-sync=target \
            O="$OUT_DIR" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            bzImage modules \
            2>&1 | tee "$LOG_DIR/kernel-build.log"
          STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========== REAL BUILD ERRORS =========="
            grep -nEi -B8 -A20 \
              '^[^[:space:]].*:[0-9]+:[0-9]+: (fatal )?error:|^ld\.lld: error:|^clang: error:|undefined reference|LLVM ERROR|out of memory|No space left on device|Killed|internal compiler error' \
              "$LOG_DIR/kernel-build.log" | head -n 500 || true

            echo
            echo "========== FINAL 300 LOG LINES =========="
            tail -n 300 "$LOG_DIR/kernel-build.log" || true

            echo
            echo "========== RUNNER RESOURCES =========="
            free -h || true
            df -h || true
            df -i || true

            exit "$STATUS"
          fi

          RELEASE="$(make -s O="$OUT_DIR" ARCH=x86_64 LLVM=1 LLVM_IAS=1 kernelrelease)"
          END="$(date +%s)"
          SECONDS="$((END - START))"
          BZIMAGE="$OUT_DIR/arch/x86/boot/bzImage"

          test -s "$BZIMAGE"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"
          test "$BZIMAGE" -nt "$BUILD_MARKER"

          OBJECTS="$(find "$OUT_DIR" -type f -name '*.o' | wc -l)"
          test "$OBJECTS" -gt 100

          grep -n 'warning:' "$LOG_DIR/kernel-build.log" > "$LOG_DIR/kernel-warnings.txt" || true
          WARNING_COUNT="$(wc -l < "$LOG_DIR/kernel-warnings.txt")"

          echo "KERNEL_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "BUILD_SECONDS=$SECONDS" >> "$GITHUB_ENV"
          echo "OBJECT_COUNT=$OBJECTS" >> "$GITHUB_ENV"
          echo "WARNING_COUNT=$WARNING_COUNT" >> "$GITHUB_ENV"

          {
            echo "## Zenith kernel compilation completed"
            echo
            echo "- Release: \`$RELEASE\`"
            echo "- Duration: **$SECONDS seconds**"
            echo "- Compiled object files: **$OBJECTS**"
            echo "- Compiler/linker warnings: **$WARNING_COUNT**"
            echo "- bzImage size: **$(stat -c '%s' "$BZIMAGE") bytes**"
            echo "- bzImage SHA-256: \`$(sha256sum "$BZIMAGE" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install and package modules
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_PATH="$MODULES_DIR" \
            INSTALL_MOD_STRIP=1 \
            modules_install \
            2>&1 | tee "$LOG_DIR/modules-install.log"

          rm -f \
            "$MODULES_DIR/lib/modules/$KERNEL_RELEASE/build" \
            "$MODULES_DIR/lib/modules/$KERNEL_RELEASE/source"

          tar --zstd -cf "$ARTIFACT_DIR/modules-${KERNEL_RELEASE}.tar.zst" -C "$MODULES_DIR" .


      - name: Enforce zero-warning build gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          : > "$LOG_DIR/all-build-warnings.txt"

          for log_name in \
            warning-cleanup-checkpatch.log \
            selinux-generated-headers.log \
            kernelsu-preflight.log \
            warning-cleanup-preflight.log \
            kernel-build.log \
            modules-install.log; do
            log_path="$LOG_DIR/$log_name"
            [ -f "$log_path" ] || continue

            # checkpatch CHECK messages are style advisories, not compiler or
            # linker warnings. Its actual WARNING diagnostics are caught by the
            # patch-application step above.
            if [ "$log_name" = warning-cleanup-checkpatch.log ]; then
              continue
            fi

            grep -nEi \
              '(^|[[:space:]])[^[:space:]]+:[0-9]+(:[0-9]+)?: warning:|^ld\.lld[^:]*: warning:|^[^[:space:]].*\.o: warning: objtool:|^WARNING: modpost:|^warning:' \
              "$log_path" | \
              sed "s#^#$log_name:#" >> "$LOG_DIR/all-build-warnings.txt" || true
          done

          WARNING_COUNT="$(wc -l < "$LOG_DIR/all-build-warnings.txt")"
          echo "WARNING_COUNT=$WARNING_COUNT" >> "$GITHUB_ENV"

          if [ "$WARNING_COUNT" -ne 0 ]; then
            echo "Zero-warning gate failed: $WARNING_COUNT warning diagnostics remain." >&2
            cat "$LOG_DIR/all-build-warnings.txt" >&2
            exit 1
          fi

          : > "$LOG_DIR/kernel-warnings.txt"
          echo "Zero-warning gate passed: no compiler, linker, objtool, modpost, or module-install warning diagnostics were found."
          {
            echo
            echo "## Zero-warning validation"
            echo
            echo "All audited source targets, the Full-LTO kernel build, and module installation completed with **0 warning diagnostics**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect verified build outputs
        shell: bash
        run: |
          set -euxo pipefail

          cp "$OUT_DIR/arch/x86/boot/bzImage" "$ARTIFACT_DIR/bzImage-${KERNEL_RELEASE}"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/config-${KERNEL_RELEASE}"
          cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map-${KERNEL_RELEASE}"
          zstd -T0 -19 "$LOG_DIR/kernel-build.log" -o "$ARTIFACT_DIR/kernel-build-${KERNEL_RELEASE}.log.zst"
          if [ -s "$LOG_DIR/kernelsu-preflight.log" ]; then
            zstd -T0 -19 "$LOG_DIR/kernelsu-preflight.log" \
              -o "$ARTIFACT_DIR/kernelsu-preflight-${KERNEL_RELEASE}.log.zst"
          fi
          if [ -s "$LOG_DIR/warning-cleanup-preflight.log" ]; then
            zstd -T0 -19 "$LOG_DIR/warning-cleanup-preflight.log" \
              -o "$ARTIFACT_DIR/warning-cleanup-preflight-${KERNEL_RELEASE}.log.zst"
          fi
          if [ -s "$LOG_DIR/warning-cleanup-checkpatch.log" ]; then
            zstd -T0 -19 "$LOG_DIR/warning-cleanup-checkpatch.log" \
              -o "$ARTIFACT_DIR/warning-cleanup-checkpatch-${KERNEL_RELEASE}.log.zst"
          fi
          if [ -s "$LOG_DIR/kernel-warnings.txt" ]; then
            cp "$LOG_DIR/kernel-warnings.txt" "$ARTIFACT_DIR/kernel-warnings-${KERNEL_RELEASE}.txt"
          fi
          zstd -T0 -19 "$LOG_DIR/modules-install.log" -o "$ARTIFACT_DIR/modules-install-${KERNEL_RELEASE}.log.zst"

          cat > "$ARTIFACT_DIR/source-info.txt" <<EOF
          Kernel repository: $KERNEL_REPO
          Kernel branch: $KERNEL_BRANCH
          Kernel commit (pinned): $KERNEL_COMMIT
          KernelSU Next repository: $KSU_REPO
          KernelSU Next branch: $KSU_BRANCH
          KernelSU Next commit (pinned): $KSU_COMMIT
          KernelSU compatibility patch: three required Zenith 6.9 fixes plus APK certificate stack fix
          Zenith warning cleanup: source/codegen fixes for all baseline diagnostics, including the Full-LTO F2FS caller-frame expansion
          Warning policy: zero compiler, linker, objtool, modpost, or module-install warning diagnostics permitted
          x86_64 runtime dispatcher fix: CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y
          Kernel release: $KERNEL_RELEASE
          Build duration seconds: $BUILD_SECONDS
          Compiled object files: $OBJECT_COUNT
          Compiler/linker warnings: $WARNING_COUNT
          EOF

          (
            cd "$ARTIFACT_DIR"
            sha256sum \
              "bzImage-${KERNEL_RELEASE}" \
              "config-${KERNEL_RELEASE}" \
              "System.map-${KERNEL_RELEASE}" \
              "modules-${KERNEL_RELEASE}.tar.zst" \
              > SHA256SUMS
          )

          test -s "$ARTIFACT_DIR/bzImage-${KERNEL_RELEASE}"
          cat "$ARTIFACT_DIR/SHA256SUMS"
          du -sh "$ARTIFACT_DIR"/*

      - name: Upload compiled kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-6.9-kernelsu-next-${{ github.run_number }}
          path: build-artifacts/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload diagnostics if build fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenith-6.9-failure-logs-${{ github.run_number }}
          path: |
            build-logs/
            ${{ env.OUT_DIR }}/.config
          retention-days: 7
          if-no-files-found: warn
