name: Build Zenith 6.9 Kernel with KernelSU Next v3 - Warning Clean V8 Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-zenith-kernel-v3.yml"
      - "kernel-configs/zenith-6.9-x86_64.config"

permissions:
  contents: read

concurrency:
  group: zenith-6.9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile x86_64 bzImage and modules
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      DEBIAN_FRONTEND: noninteractive
      WORKFLOW_REVISION: "2026-07-28-v8-fixed-f2fs-write-cache-pages"
      KERNEL_REPO: https://github.com/android-generic/kernel-zenith.git
      KERNEL_BRANCH: "6.9"
      KERNEL_COMMIT: "12777f26667d321594dc60d2c1814d8ec9152dea"
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_BRANCH: dev
      KSU_COMMIT: "d6a42fd9285c11b8e8e67bfe72a5050528006c00"
      KERNEL_DIR: ${{ github.workspace }}/kernel-source/kernel-zenith
      OUT_DIR: ${{ github.workspace }}/kernel-source/kernel-zenith/out
      CONFIG_FILE: ${{ github.workspace }}/kernel-configs/zenith-6.9-x86_64.config
      ARTIFACT_DIR: ${{ github.workspace }}/build-artifacts
      LOG_DIR: ${{ github.workspace }}/build-logs
      MODULES_DIR: ${{ github.workspace }}/modules-staging

    steps:
      - name: Confirm workflow revision
        shell: bash
        run: |
          set -euxo pipefail
          echo "Running workflow revision: $WORKFLOW_REVISION"
          echo "Expected fixed verification: source \"drivers/kernelsu/Kconfig\""

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Show runner resources
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          echo "CPU cores: $(nproc)"
          free -h
          df -h /

      - name: Update Ubuntu package index
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update

      - name: Install kernel, Android, Bazel, Python and Rust prerequisites
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get install -y --no-install-recommends \
            ca-certificates gnupg curl wget git git-lfs \
            flex bison build-essential gcc g++ gcc-multilib g++-multilib \
            make bc binutils binutils-dev clang llvm lld libclang-dev \
            libssl-dev libelf-dev libdw-dev dwarves sparse \
            libncurses-dev pkg-config perl rsync cpio kmod fakeroot \
            zip unzip tar gzip bzip2 xz-utils lz4 zstd \
            zlib1g-dev liblz4-dev libzstd-dev liblzma-dev \
            libc6-dev-i386 lib32z1-dev x11proto-dev libx11-dev \
            libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            python3 python3-dev python3-pip python3-setuptools \
            python3-wheel python3-venv python3-pyelftools python3-yaml \
            python3-jinja2 python-is-python3 \
            device-tree-compiler u-boot-tools ccache ninja-build cmake \
            autoconf automake libtool gettext gawk file patch diffutils jq \
            openssl openjdk-17-jdk-headless libcap-dev libudev-dev libpci-dev

          # Android repo launcher.
          sudo curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo

          # Bazel through Bazelisk.
          sudo curl --fail --location --retry 5 \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 \
            --output /usr/local/bin/bazelisk
          sudo chmod 0755 /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

          # Rust toolchain and bindgen, needed by Rust-enabled kernel trees.
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup component add rust-src rustfmt clippy
          cargo install --locked bindgen-cli
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          git lfs install --skip-repo
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Verify supplied kernel config
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$CONFIG_FILE"
          grep -qx 'CONFIG_X86_64=y' "$CONFIG_FILE"
          grep -qx 'CONFIG_MODULES=y' "$CONFIG_FILE"
          grep -qx 'CONFIG_KSU=y' "$CONFIG_FILE"
          grep -qx 'CONFIG_KPROBES=y' "$CONFIG_FILE"
          grep -qx 'CONFIG_EXT4_FS=y' "$CONFIG_FILE"
          grep -qx 'CONFIG_OVERLAY_FS=y' "$CONFIG_FILE"
          sha256sum "$CONFIG_FILE"

      - name: Clone pinned Zenith kernel revision
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$KERNEL_DIR"
          mkdir -p "$(dirname "$KERNEL_DIR")"

          git init "$KERNEL_DIR"
          git -C "$KERNEL_DIR" remote add origin "$KERNEL_REPO"
          git -C "$KERNEL_DIR" fetch --depth 1 origin "$KERNEL_COMMIT"
          git -C "$KERNEL_DIR" checkout --detach FETCH_HEAD

          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$KERNEL_COMMIT"
          git -C "$KERNEL_DIR" log -1 --oneline

      - name: Remove old KernelSU tree and integration
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          git submodule deinit -f -- KernelSU 2>/dev/null || true
          rm -rf KernelSU .git/modules/KernelSU
          rm -f drivers/kernelsu

          if [ -f .gitmodules ]; then
            git config -f .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
            if ! grep -q '^\[submodule ' .gitmodules; then
              rm -f .gitmodules
            fi
          fi

          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("drivers/Makefile")
          make_entry = "obj-$(CONFIG_KSU) += kernelsu/"
          lines = [line for line in makefile.read_text().splitlines() if line.strip() != make_entry]
          makefile.write_text("\n".join(lines).rstrip() + "\n")

          kconfig = Path("drivers/Kconfig")
          kconfig_entry = 'source "drivers/kernelsu/Kconfig"'
          lines = [line for line in kconfig.read_text().splitlines() if line.strip() != kconfig_entry]
          kconfig.write_text("\n".join(lines).rstrip() + "\n")
          PY

          test ! -e KernelSU
          test ! -e drivers/kernelsu

      - name: Clone pinned KernelSU Next revision
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          rm -rf KernelSU-Next

          # Keep full branch history so KernelSU's version/tag calculation remains
          # correct, then detach at the exact audited commit.
          git clone --branch "$KSU_BRANCH" --single-branch "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"

          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Kbuild
          test -f KernelSU-Next/kernel/hook/x86_64/syscall_hook.c

          # Linux 6.9 hardened x86_64 syscall dispatch. Refuse to build unless
          # the KernelSU Next runtime dispatcher patch implementation is present.
          grep -q 'CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER' \
            KernelSU-Next/kernel/hook/x86_64/syscall_hook.c
          grep -q 'patch_abs_jump("x64_sys_call"' \
            KernelSU-Next/kernel/hook/x86_64/syscall_hook.c

          git -C KernelSU-Next log -1 --oneline

      - name: Apply audited KernelSU compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR/KernelSU-Next"

          # Audited against Zenith Linux 6.9.9 commit $KERNEL_COMMIT and
          # KernelSU Next commit $KSU_COMMIT. This fixes three definite compile
          # blockers and one Full-LTO stack-frame warning.
          git apply --check - <<'PATCH'
          diff --git a/kernel/feature/sulog.h b/kernel/feature/sulog.h
          index f69494d..006ad71 100644
          --- a/kernel/feature/sulog.h
          +++ b/kernel/feature/sulog.h
          @@ -1,6 +1,7 @@
           #ifndef __KSU_H_SULOG
           #define __KSU_H_SULOG
           
          +#include <linux/init.h>
           #include <linux/types.h>
           
           bool ksu_sulog_is_enabled(void);
          diff --git a/kernel/hook/lsm_hook.c b/kernel/hook/lsm_hook.c
          index 4598c6b..6e0df13 100644
          --- a/kernel/hook/lsm_hook.c
          +++ b/kernel/hook/lsm_hook.c
          @@ -18,6 +18,11 @@ struct ksu_lsm_hook_entry {
               struct ksu_lsm_hook *hook;
           };
           
          +static const struct lsm_id ksu_lsm_id = {
          +    .name = "ksu",
          +    .id = LSM_ID_UNDEF,
          +};
          +
           static DEFINE_MUTEX(ksu_lsm_hook_lock);
           static struct ksu_lsm_hook_entry ksu_lsm_hook_entries[16];
           static int ksu_lsm_hook_count;
          @@ -343,7 +348,7 @@ int ksu_lsm_hook(struct ksu_lsm_hook *hook)
                               hook->list.head = head;
                               hook->list.list.next = NULL;
                               hook->list.list.pprev = &head->first;
          -                    hook->list.lsm = "ksu";
          +                    hook->list.lsmid = &ksu_lsm_id;
                               *(void **)((char *)selected_entry + hook->hook_offset) = hook->replacement;
                               selected_slot = (void **)&head->first;
                               selected_origin = NULL;
          diff --git a/kernel/infra/file_wrapper.c b/kernel/infra/file_wrapper.c
          index dbad19b..9f3a1b8 100644
          --- a/kernel/infra/file_wrapper.c
          +++ b/kernel/infra/file_wrapper.c
          @@ -258,7 +258,7 @@ void ksu_wrapper_splice_eof(struct file *fp)
           }
           #endif
           
          -#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)
          +#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 9, 0)
           static int ksu_wrapper_setlease(struct file *fp, int arg1,
                                           struct file_lease **fl, void **p)
           {
          diff --git a/kernel/manager/apk_sign.c b/kernel/manager/apk_sign.c
          index 95beea8..a380c92 100644
          --- a/kernel/manager/apk_sign.c
          +++ b/kernel/manager/apk_sign.c
          @@ -95,21 +95,28 @@ static bool check_block(struct file *fp, u32 *size4, loff_t *pos, u32 *offset,
           		*offset += *size4;
           
           #define CERT_MAX_LENGTH 1024
          -		char cert[CERT_MAX_LENGTH];
          +		char *cert;
          +		unsigned char digest[SHA256_DIGEST_SIZE];
          +		char hash_str[SHA256_DIGEST_SIZE * 2 + 1];
          +
           		if (*size4 > CERT_MAX_LENGTH) {
           			pr_info("cert length overlimit\n");
           			return false;
           		}
          +
          +		cert = kmalloc(*size4, GFP_KERNEL);
          +		if (!cert)
          +			return false;
          +
           		kernel_read(fp, cert, *size4, pos);
          -		unsigned char digest[SHA256_DIGEST_SIZE];
          -		if (IS_ERR(ksu_sha256(cert, *size4, digest))) {
          +		if (ksu_sha256(cert, *size4, digest)) {
           			pr_info("sha256 error\n");
          +			kfree(cert);
           			return false;
           		}
          +		kfree(cert);
           
          -		char hash_str[SHA256_DIGEST_SIZE * 2 + 1];
           		hash_str[SHA256_DIGEST_SIZE * 2] = '\0';
          -
                   bin2hex(hash_str, digest, SHA256_DIGEST_SIZE);
                   pr_info("sha256: %s, expected: %s\n", hash_str, expected_sha256);
                   if (strcmp(expected_sha256, hash_str) == 0) {
          PATCH
          git apply - <<'PATCH'
          diff --git a/kernel/feature/sulog.h b/kernel/feature/sulog.h
          index f69494d..006ad71 100644
          --- a/kernel/feature/sulog.h
          +++ b/kernel/feature/sulog.h
          @@ -1,6 +1,7 @@
           #ifndef __KSU_H_SULOG
           #define __KSU_H_SULOG
           
          +#include <linux/init.h>
           #include <linux/types.h>
           
           bool ksu_sulog_is_enabled(void);
          diff --git a/kernel/hook/lsm_hook.c b/kernel/hook/lsm_hook.c
          index 4598c6b..6e0df13 100644
          --- a/kernel/hook/lsm_hook.c
          +++ b/kernel/hook/lsm_hook.c
          @@ -18,6 +18,11 @@ struct ksu_lsm_hook_entry {
               struct ksu_lsm_hook *hook;
           };
           
          +static const struct lsm_id ksu_lsm_id = {
          +    .name = "ksu",
          +    .id = LSM_ID_UNDEF,
          +};
          +
           static DEFINE_MUTEX(ksu_lsm_hook_lock);
           static struct ksu_lsm_hook_entry ksu_lsm_hook_entries[16];
           static int ksu_lsm_hook_count;
          @@ -343,7 +348,7 @@ int ksu_lsm_hook(struct ksu_lsm_hook *hook)
                               hook->list.head = head;
                               hook->list.list.next = NULL;
                               hook->list.list.pprev = &head->first;
          -                    hook->list.lsm = "ksu";
          +                    hook->list.lsmid = &ksu_lsm_id;
                               *(void **)((char *)selected_entry + hook->hook_offset) = hook->replacement;
                               selected_slot = (void **)&head->first;
                               selected_origin = NULL;
          diff --git a/kernel/infra/file_wrapper.c b/kernel/infra/file_wrapper.c
          index dbad19b..9f3a1b8 100644
          --- a/kernel/infra/file_wrapper.c
          +++ b/kernel/infra/file_wrapper.c
          @@ -258,7 +258,7 @@ void ksu_wrapper_splice_eof(struct file *fp)
           }
           #endif
           
          -#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)
          +#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 9, 0)
           static int ksu_wrapper_setlease(struct file *fp, int arg1,
                                           struct file_lease **fl, void **p)
           {
          diff --git a/kernel/manager/apk_sign.c b/kernel/manager/apk_sign.c
          index 95beea8..a380c92 100644
          --- a/kernel/manager/apk_sign.c
          +++ b/kernel/manager/apk_sign.c
          @@ -95,21 +95,28 @@ static bool check_block(struct file *fp, u32 *size4, loff_t *pos, u32 *offset,
           		*offset += *size4;
           
           #define CERT_MAX_LENGTH 1024
          -		char cert[CERT_MAX_LENGTH];
          +		char *cert;
          +		unsigned char digest[SHA256_DIGEST_SIZE];
          +		char hash_str[SHA256_DIGEST_SIZE * 2 + 1];
          +
           		if (*size4 > CERT_MAX_LENGTH) {
           			pr_info("cert length overlimit\n");
           			return false;
           		}
          +
          +		cert = kmalloc(*size4, GFP_KERNEL);
          +		if (!cert)
          +			return false;
          +
           		kernel_read(fp, cert, *size4, pos);
          -		unsigned char digest[SHA256_DIGEST_SIZE];
          -		if (IS_ERR(ksu_sha256(cert, *size4, digest))) {
          +		if (ksu_sha256(cert, *size4, digest)) {
           			pr_info("sha256 error\n");
          +			kfree(cert);
           			return false;
           		}
          +		kfree(cert);
           
          -		char hash_str[SHA256_DIGEST_SIZE * 2 + 1];
           		hash_str[SHA256_DIGEST_SIZE * 2] = '\0';
          -
                   bin2hex(hash_str, digest, SHA256_DIGEST_SIZE);
                   pr_info("sha256: %s, expected: %s\n", hash_str, expected_sha256);
                   if (strcmp(expected_sha256, hash_str) == 0) {
          PATCH

          git diff --check
          git diff --stat

      - name: Apply Zenith source warning cleanup patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          mkdir -p "$LOG_DIR"

          # Source-level fixes for all 25 warning diagnostics observed in the
          # successful 6.9.9-zenith Full-LTO build. Do not hide diagnostics by
          # raising CONFIG_FRAME_WARN or globally disabling warning classes.
          cat > "$RUNNER_TEMP/zenith-6.9-warning-cleanup.patch" <<'PATCH'
          diff --git a/arch/x86/kernel/cpu/intel.c b/arch/x86/kernel/cpu/intel.c
          index 136fb8df8..eb97d4fdd 100644
          --- a/arch/x86/kernel/cpu/intel.c
          +++ b/arch/x86/kernel/cpu/intel.c
          @@ -355,7 +355,7 @@ static void early_init_intel(struct cpuinfo_x86 *c)
           		switch (c->x86_model) {
           		case INTEL_FAM6_ATOM_SILVERMONT:
           			set_cpu_cap(c, X86_FEATURE_TSC_RELIABLE);
          -			/* Fall through */
          +			fallthrough;
           		case INTEL_FAM6_ATOM_SALTWELL_MID:
           		case INTEL_FAM6_ATOM_SALTWELL_TABLET:
           		case INTEL_FAM6_ATOM_SILVERMONT_MID:
          diff --git a/drivers/bluetooth/Makefile b/drivers/bluetooth/Makefile
          index 7a5967e9a..846d49dd1 100644
          --- a/drivers/bluetooth/Makefile
          +++ b/drivers/bluetooth/Makefile
          @@ -3,6 +3,7 @@
           # Makefile for the Linux Bluetooth HCI device drivers.
           #
           
          +CFLAGS_hci_vhci.o += -fno-optimize-sibling-calls
           obj-$(CONFIG_BT_HCIVHCI)	+= hci_vhci.o
           obj-$(CONFIG_BT_HCIUART)	+= hci_uart.o
           obj-$(CONFIG_BT_HCIBCM203X)	+= bcm203x.o
          diff --git a/drivers/bluetooth/hci_vhci.c b/drivers/bluetooth/hci_vhci.c
          index 28750a40f..4bfc78f97 100644
          --- a/drivers/bluetooth/hci_vhci.c
          +++ b/drivers/bluetooth/hci_vhci.c
          @@ -289,18 +289,18 @@ static void vhci_coredump(struct hci_dev *hdev)
           
           static void vhci_coredump_hdr(struct hci_dev *hdev, struct sk_buff *skb)
           {
          -	char buf[80];
          +	const char *buf;
           
          -	snprintf(buf, sizeof(buf), "Controller Name: vhci_ctrl\n");
          +	buf = "Controller Name: vhci_ctrl\n";
           	skb_put_data(skb, buf, strlen(buf));
           
          -	snprintf(buf, sizeof(buf), "Firmware Version: vhci_fw\n");
          +	buf = "Firmware Version: vhci_fw\n";
           	skb_put_data(skb, buf, strlen(buf));
           
          -	snprintf(buf, sizeof(buf), "Driver: vhci_drv\n");
          +	buf = "Driver: vhci_drv\n";
           	skb_put_data(skb, buf, strlen(buf));
           
          -	snprintf(buf, sizeof(buf), "Vendor: vhci\n");
          +	buf = "Vendor: vhci\n";
           	skb_put_data(skb, buf, strlen(buf));
           }
           
          diff --git a/drivers/crypto/ccp/ccp-ops.c b/drivers/crypto/ccp/ccp-ops.c
          index cb8e99936..9d3758440 100644
          --- a/drivers/crypto/ccp/ccp-ops.c
          +++ b/drivers/crypto/ccp/ccp-ops.c
          @@ -12,6 +12,7 @@
           #include <linux/module.h>
           #include <linux/kernel.h>
           #include <linux/interrupt.h>
          +#include <linux/slab.h>
           #include <crypto/scatterwalk.h>
           #include <crypto/des.h>
           #include <linux/ccp.h>
          @@ -644,10 +645,10 @@ ccp_run_aes_gcm_cmd(struct ccp_cmd_queue *cmd_q, struct ccp_cmd *cmd)
           	__be64 *final;
           	int ret;
           
          -	struct scatterlist *p_inp, sg_inp[2];
          -	struct scatterlist *p_tag, sg_tag[2];
          -	struct scatterlist *p_outp, sg_outp[2];
          -	struct scatterlist *p_aad;
          +	struct scatterlist *p_inp, *sg_inp;
          +	struct scatterlist *p_tag, *sg_tag;
          +	struct scatterlist *p_outp, *sg_outp;
          +	struct scatterlist *p_aad, *sgl;
           
           	if (!aes->iv)
           		return -EINVAL;
          @@ -675,6 +676,13 @@ ccp_run_aes_gcm_cmd(struct ccp_cmd_queue *cmd_q, struct ccp_cmd *cmd)
           		return -EINVAL;
           	}
           
          +	sgl = kcalloc(6, sizeof(*sgl), GFP_KERNEL);
          +	if (!sgl)
          +		return -ENOMEM;
          +	sg_inp = sgl;
          +	sg_tag = sgl + 2;
          +	sg_outp = sgl + 4;
          +
           	/* First, decompose the source buffer into AAD & PT,
           	 * and the destination buffer into AAD, CT & tag, or
           	 * the input into CT & tag.
          @@ -708,7 +716,7 @@ ccp_run_aes_gcm_cmd(struct ccp_cmd_queue *cmd_q, struct ccp_cmd *cmd)
           				   CCP_AES_CTX_SB_COUNT * CCP_SB_BYTES,
           				   DMA_TO_DEVICE);
           	if (ret)
          -		return ret;
          +		goto e_sgl;
           
           	dm_offset = CCP_SB_BYTES - aes->key_len;
           	ret = ccp_set_dm_area(&key, dm_offset, aes->key, 0, aes->key_len);
          @@ -909,6 +917,8 @@ ccp_run_aes_gcm_cmd(struct ccp_cmd_queue *cmd_q, struct ccp_cmd *cmd)
           e_key:
           	ccp_dm_free(&key);
           
          +e_sgl:
          +	kfree(sgl);
           	return ret;
           }
           
          diff --git a/drivers/gpu/drm/radeon/radeon_cs.c b/drivers/gpu/drm/radeon/radeon_cs.c
          index a6700d727..575eec15e 100644
          --- a/drivers/gpu/drm/radeon/radeon_cs.c
          +++ b/drivers/gpu/drm/radeon/radeon_cs.c
          @@ -27,6 +27,7 @@
           
           #include <linux/list_sort.h>
           #include <linux/pci.h>
          +#include <linux/slab.h>
           #include <linux/uaccess.h>
           
           #include <drm/drm_device.h>
          @@ -669,64 +670,66 @@ static int radeon_cs_ib_fill(struct radeon_device *rdev, struct radeon_cs_parser
           int radeon_cs_ioctl(struct drm_device *dev, void *data, struct drm_file *filp)
           {
           	struct radeon_device *rdev = dev->dev_private;
          -	struct radeon_cs_parser parser;
