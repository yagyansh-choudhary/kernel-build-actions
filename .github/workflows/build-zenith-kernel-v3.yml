           	int r;
           
          +	parser = kzalloc(sizeof(*parser), GFP_KERNEL);
          +	if (!parser)
          +		return -ENOMEM;
          +
           	down_read(&rdev->exclusive_lock);
           	if (!rdev->accel_working) {
           		up_read(&rdev->exclusive_lock);
